[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.rstcheck]
report_level = "WARNING"
ignore_directives = ["autoclass", "autofunction"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]


[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"


[tool.poetry.group.dev.dependencies]
mypy = "^1"
rstcheck = "^6"
wheel = "^0"
build = "^1"
twine = "^6"
coverage = "^7"
pytest-mock = "^3"
requests = "^2"
types-requests = "^2"
tox = "^4"
sphinx = "^9"
furo = "^2025"
pytest = "^9"
isort = "^8"
pycodestyle = "^2"


[tool.setuptools.package-data]
charex = [
    "data/help_xt.txt",
    "data/path_map.json",
    "data/prop_map.json",
    'data/quote.html',
    'data/result.html',
    'data/entities.json',
    'data/v14_0/sources.json',
    'data/v14_0/idna2008.txt',
    'data/v14_0/Denormal.zip',
    'data/v14_0/UCD.zip',
    'data/v14_0/Unihan.zip',
    'data/v14_0/emoji-zwj-sequences.txt',
    'data/v15_0/sources.json',
    'data/v15_0/idna2008.txt',
    'data/v15_0/Denormal.zip',
    'data/v15_0/UCD.zip',
    'data/v15_0/Unihan.zip',
    'data/v15_0/emoji-zwj-sequences.txt',
    'data/v15_1/sources.json',
    'data/v15_1/idna2008.txt',
    'data/v15_1/Denormal.zip',
    'data/v15_1/UCD.zip',
    'data/v15_1/Unihan.zip',
    'data/v15_1/emoji-zwj-sequences.txt',
    'data/v16_0/sources.json',
    'data/v16_0/idna2008.txt',
    'data/v16_0/Denormal.zip',
    'data/v16_0/UCD.zip',
    'data/v16_0/Unihan.zip',
    'data/v16_0/emoji-zwj-sequences.txt',
]


[tool.tox]
legacy_tox_ini = """[tox]
envlist = py312, py313, py314


[testenv]
allowlist_externals = isort, poetry
commands_pre =
    poetry sync --no-root
commands =
    poetry run pytest tests/ --import-mode importlib
    isort ./src/charex --check-only --diff --skip .tox --lai 2 -m 3
    isort ./tests --check-only --diff --skip .tox --lai 2 -m 3
deps = -rrequirements.txt
    pytest
    pytest-mock
"""

[project]
name = "charex"
version = "0.2.4"
authors = [
    {name="Paul J. Iutzi", email="pji@mac.com"},
]
description = "A unicode and character set explorer."
readme = "README.rst"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE*",]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    'flask',
    'blessed',
]

[project.urls]
"Homepage" = "https://charex.readthedocs.io/en/latest/index.html#"
"Documentation" = "https://charex.readthedocs.io/en/latest/index.html#"
"Source" = "https://github.com/pji/charex"

[project.scripts]
charex = "charex.__main__:main"
